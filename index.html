<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Nazareth - Entrevistas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 flex justify-center space-x-8">
            <button id="tabPostulantes" class="py-4 px-2 font-bold border-b-4 border-white text-white focus:outline-none">
                Postulantes
            </button>
            <button id="tabAdmin" class="py-4 px-2 font-bold border-b-4 border-transparent text-blue-300 hover:text-white focus:outline-none">
                Administración
            </button>
        </div>
    </nav>

    <div class="p-4 sm:p-8 flex justify-center">

        <!-- PESTAÑA POSTULANTES -->
        <div id="vistaPostulantes" class="max-w-xl w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-900 mb-2">Academia Nazareth</h1>
                <p class="text-gray-600">Agenda de Entrevistas y Clase Modelo</p>
            </div>

            <form id="reservaForm" class="space-y-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                        <input type="text" id="nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Teléfono (WhatsApp)</label>
                        <input type="tel" id="telefono" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Especialidad a postular</label>
                        <select id="especialidad" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-blue-500 focus:ring-blue-500">
                            <option value="">Seleccione un área...</option>
                            <option value="Matemáticas">Matemáticas</option>
                            <option value="Letras">Letras</option>
                            <option value="Humanidades">Humanidades</option>
                            <option value="Ciencias Básicas">Ciencias Básicas</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. Selecciona la Fecha</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2" id="contenedorFechas"></div>
                </div>

                <div id="seccionHoras" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. Selecciona la Hora</label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="contenedorHoras"></div>
                </div>

                <input type="hidden" id="fechaSeleccionada">
                <input type="hidden" id="horaSeleccionada">

                <button type="submit" id="btnReservar" class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:bg-gray-400">
                    Confirmar Reserva
                </button>
            </form>

            <div id="mensajeExito" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-md text-center">
                ¡Reserva confirmada con éxito! Nos comunicaremos por WhatsApp.
            </div>
        </div>

        <!-- PESTAÑA ADMINISTRADOR -->
        <div id="vistaLogin" class="hidden max-w-sm w-full bg-white p-8 rounded-xl shadow-lg mt-10">
            <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Acceso Privado</h2>
            <div class="space-y-4">
                <input type="text" id="usuarioInput" placeholder="Usuario" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-blue-500">
                <input type="password" id="claveInput" placeholder="Contraseña" class="w-full border border-gray-300 p-3 rounded-md focus:outline-none focus:border-blue-500">
                <button id="btnIngresar" class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-800">
                    Ingresar
                </button>
                <p id="errorMsg" class="text-red-500 text-sm text-center hidden">Credenciales incorrectas</p>
            </div>
        </div>

        <div id="vistaPanelAdmin" class="hidden max-w-5xl w-full">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-blue-900">Panel de Entrevistas</h1>
                <button id="btnDescargarPDF" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md flex items-center shadow">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Descargar PDF
                </button>
            </div>

            <div id="contenidoPDF" class="bg-white p-6 sm:p-8 rounded-xl shadow-lg">
                <div class="text-center mb-6 border-b pb-4">
                    <h2 class="text-2xl font-bold uppercase text-gray-800">Reporte de Postulantes</h2>
                    <p class="text-gray-500">Academia Nazareth - Proceso de Selección</p>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto border-collapse border border-gray-300">
                        <thead class="bg-blue-900 text-white">
                            <tr>
                                <th class="border border-gray-300 px-4 py-3 text-left">Fecha y Hora</th>
                                <th class="border border-gray-300 px-4 py-3 text-left">Postulante</th>
                                <th class="border border-gray-300 px-4 py-3 text-left">Especialidad</th>
                                <th class="border border-gray-300 px-4 py-3 text-left">Celular</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo" class="text-gray-700">
                            <!-- Datos generados por JS -->
                        </tbody>
                    </table>
                </div>
                <div class="mt-4 text-sm text-gray-500 text-right" id="fechaReporte"></div>
            </div>
        </div>

    </div>

    <!-- LÓGICA DEL SISTEMA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const USUARIO_ADMIN = "admin";
        const CLAVE_ADMIN = "nazareth2026"; 

        const firebaseConfig = {
            apiKey: "AIzaSyAjiyyNhmbqR0-O-OKY6JH5lDb67b9T0fk",
            authDomain: "entrevista-7be94.firebaseapp.com",
            projectId: "entrevista-7be94",
            storageBucket: "entrevista-7be94.firebasestorage.app",
            messagingSenderId: "423282719763",
            appId: "1:423282719763:web:d5103d1e2495b98c4a93e6",
            measurementId: "G-00CN5DJ3CQ"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.log("Error de conexión");
        }

        const tabPostulantes = document.getElementById('tabPostulantes');
        const tabAdmin = document.getElementById('tabAdmin');
        const vistaPostulantes = document.getElementById('vistaPostulantes');
        const vistaLogin = document.getElementById('vistaLogin');
        const vistaPanelAdmin = document.getElementById('vistaPanelAdmin');
        let adminAutenticado = false;

        tabPostulantes.addEventListener('click', () => {
            tabPostulantes.className = "py-4 px-2 font-bold border-b-4 border-white text-white focus:outline-none";
            tabAdmin.className = "py-4 px-2 font-bold border-b-4 border-transparent text-blue-300 hover:text-white focus:outline-none";
            vistaPostulantes.classList.remove('hidden');
            vistaLogin.classList.add('hidden');
            vistaPanelAdmin.classList.add('hidden');
        });

        tabAdmin.addEventListener('click', () => {
            tabAdmin.className = "py-4 px-2 font-bold border-b-4 border-white text-white focus:outline-none";
            tabPostulantes.className = "py-4 px-2 font-bold border-b-4 border-transparent text-blue-300 hover:text-white focus:outline-none";
            vistaPostulantes.classList.add('hidden');
            if(adminAutenticado) {
                vistaPanelAdmin.classList.remove('hidden');
            } else {
                vistaLogin.classList.remove('hidden');
            }
        });

        document.getElementById('btnIngresar').addEventListener('click', () => {
            const usr = document.getElementById('usuarioInput').value;
            const pass = document.getElementById('claveInput').value;

            if(usr === USUARIO_ADMIN && pass === CLAVE_ADMIN) {
                adminAutenticado = true;
                vistaLogin.classList.add('hidden');
                vistaPanelAdmin.classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });

        const fechasDisponibles = [
            { id: '2026-11-21', texto: 'Sáb 21 Nov' },
            { id: '2026-11-28', texto: 'Sáb 28 Nov' },
            { id: '2026-12-12', texto: 'Sáb 12 Dic' }
        ];
        const horasDisponibles = ['15:00', '15:30', '16:00', '16:30', '17:00', '17:30'];
        let reservasCompletas = [];

        const form = document.getElementById('reservaForm');
        const contFechas = document.getElementById('contenedorFechas');
        const contHoras = document.getElementById('contenedorHoras');
        const seccionHoras = document.getElementById('seccionHoras');
        const inputFecha = document.getElementById('fechaSeleccionada');
        const inputHora = document.getElementById('horaSeleccionada');
        const btnReservar = document.getElementById('btnReservar');
        const tablaCuerpo = document.getElementById('tablaCuerpo');

        fechasDisponibles.forEach(fecha => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'p-2 border rounded-md text-sm font-medium border-gray-300 hover:border-blue-500 hover:text-blue-600 focus:outline-none';
            btn.innerText = fecha.texto;
            btn.onclick = () => seleccionarFecha(fecha.id, btn);
            contFechas.appendChild(btn);
        });

        function seleccionarFecha(fechaId, botonClickeado) {
            inputFecha.value = fechaId;
            inputHora.value = '';
            Array.from(contFechas.children).forEach(b => {
                b.classList.remove('bg-blue-50', 'border-blue-500', 'text-blue-700');
                b.classList.add('border-gray-300');
            });
            botonClickeado.classList.remove('border-gray-300');
            botonClickeado.classList.add('bg-blue-50', 'border-blue-500', 'text-blue-700');
            renderizarHoras(fechaId);
            seccionHoras.classList.remove('hidden');
        }

        function renderizarHoras(fechaId) {
            contHoras.innerHTML = '';
            const ocupadasIDs = reservasCompletas.map(r => r.idUnico);
            
            horasDisponibles.forEach(hora => {
                const idReserva = `${fechaId}_${hora}`;
                const estaOcupada = ocupadasIDs.includes(idReserva);
                
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `p-2 border rounded-md text-sm font-medium focus:outline-none transition-colors ${estaOcupada ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'border-gray-300 hover:border-blue-500 hover:text-blue-600'}`;
                btn.innerText = estaOcupada ? 'Ocupado' : hora;
                btn.disabled = estaOcupada;
                
                if (!estaOcupada) {
                    btn.onclick = () => seleccionarHora(hora, btn);
                }
                contHoras.appendChild(btn);
            });
        }

        function seleccionarHora(hora, botonClickeado) {
            inputHora.value = hora;
            Array.from(contHoras.children).forEach(b => {
                if(!b.disabled) {
                    b.classList.remove('bg-blue-900', 'text-white');
                    b.classList.add('border-gray-300');
                }
            });
            botonClickeado.classList.remove('border-gray-300');
            botonClickeado.classList.add('bg-blue-900', 'text-white');
        }

        if(db) {
            onSnapshot(collection(db, "reservas"), (snapshot) => {
                reservasCompletas = snapshot.docs.map(doc => doc.data());
                if (inputFecha.value) renderizarHoras(inputFecha.value); 
                actualizarTablaAdmin();
            });
        }

        function actualizarTablaAdmin() {
            tablaCuerpo.innerHTML = '';
            let reservasOrdenadas = [...reservasCompletas].sort((a, b) => a.idUnico.localeCompare(b.idUnico));
            
            if(reservasOrdenadas.length === 0) {
                tablaCuerpo.innerHTML = `<tr><td colspan="4" class="text-center py-4">Aún no hay postulantes registrados.</td></tr>`;
                return;
            }

            reservasOrdenadas.forEach(res => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="border border-gray-300 px-4 py-2 font-medium whitespace-nowrap">${res.fecha} | ${res.hora}</td>
                    <td class="border border-gray-300 px-4 py-2 uppercase">${res.nombre}</td>
                    <td class="border border-gray-300 px-4 py-2">${res.especialidad}</td>
                    <td class="border border-gray-300 px-4 py-2">
                        <a href="https://wa.me/51${res.telefono.replace(/\s+/g, '')}" target="_blank" class="text-blue-600 hover:underline">
                            ${res.telefono}
                        </a>
                    </td>
                `;
                tablaCuerpo.appendChild(tr);
            });

            const hoy = new Date();
            document.getElementById('fechaReporte').innerText = "Reporte generado el: " + hoy.toLocaleDateString() + " " + hoy.toLocaleTimeString();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!inputFecha.value || !inputHora.value) {
                alert('Por favor selecciona una fecha y una hora.');
                return;
            }

            const nuevaReserva = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                especialidad: document.getElementById('especialidad').value,
                fecha: inputFecha.value,
                hora: inputHora.value,
                idUnico: `${inputFecha.value}_${inputHora.value}`, 
                timestamp: new Date()
            };

            btnReservar.disabled = true;
            btnReservar.innerText = "Guardando...";

            try {
                await addDoc(collection(db, "reservas"), nuevaReserva);
                form.classList.add('hidden');
                document.getElementById('mensajeExito').classList.remove('hidden');
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Ocurrió un error. Intenta de nuevo.");
                btnReservar.disabled = false;
                btnReservar.innerText = "Confirmar Reserva";
            }
        });

        document.getElementById('btnDescargarPDF').addEventListener('click', () => {
            const elemento = document.getElementById('contenidoPDF');
            const opciones = { margin: 10, filename: 'Reporte_Postulantes_Nazareth.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opciones).from(elemento).save();
        });
    </script>
</body>
</html>
